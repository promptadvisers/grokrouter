name: Installation problem
description: Report a GrokRouter setup or repair failure without sharing secrets.
title: "[Install]: "
labels:
  - installation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Never paste an OpenRouter key, Codex device code, password, conversation, private Bot file, or Grok host source. GrokRouter's safe report contains the complete non-secret fingerprint we need.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Choose the physical computer running the Grok Bot desktop app. Windows builds are source previews and have not completed native live acceptance; macOS Apple silicon is the supported beginner path. The Bot computer may separately report x86_64, which is normal cloud architecture.
      options:
        - Apple-silicon Mac
        - Windows x64 preview
        - Windows Arm64 preview
        - Unsupported or unknown
    validations:
      required: true

  - type: input
    id: grokrouter_version
    attributes:
      label: GrokRouter version
      description: Enter the Installer line from Copy safe diagnostics, such as 0.1.0-beta.46. Do not enter Grok Bot 0.30.0 here.
      placeholder: 0.1.0-beta.46
    validations:
      required: true

  - type: input
    id: grok_bot_version
    attributes:
      label: Grok Bot desktop version
      description: Enter the official desktop app version separately from the GrokRouter version. State whether Grok Bot updated after installation or before this failure.
      placeholder: "0.30.0; updated to 0.36.0 before Repair"
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Installation source
      description: Choose the exact package or command you ran. The pinned Terminal command is macOS-only. Old forks and downloaded copies can contain an earlier router even when this README is current.
      options:
        - Pinned Mac Terminal command from the official README
        - Windows x64 CI preview artifact
        - Windows Arm64 CI preview artifact
        - ZIP downloaded from the official repository
        - Fork, clone, old ZIP, or another source
        - I do not know
    validations:
      required: true

  - type: dropdown
    id: existing_router
    attributes:
      label: Was another Grok Bot router installed first?
      description: Do not layer GrokRouter on top of OpenGrok or another router. More than one tool can modify the same cloud host, so the exact order matters.
      options:
        - No prior router
        - Older GrokRouter only
        - OpenGrok or another router
        - More than one router, or I do not know
    validations:
      required: true

  - type: dropdown
    id: literal_provider_result
    attributes:
      label: Result after manually typing /provider
      description: Type the full command in a genuinely new Bot only after installation says it finished; do not rely on the slash-suggestion menu. If installation did not finish, choose that answer instead of testing an older Bot.
      options:
        - It named Codex SDK or OpenRouter and a model
        - It produced an ordinary AI answer
        - It was ignored or produced no answer
        - Installation did not finish, so I did not test this
    validations:
      required: true

  - type: dropdown
    id: host_adapter_result
    attributes:
      label: Host adapter result
      description: Use the GrokRouter desktop app's Run Doctor result. Do not ask Grok Bot to install or repair itself.
      options:
        - Patched and verified
        - stock-or-unknown or no router marker
        - Unsupported or changed host
        - Installation stopped before I could run Doctor
    validations:
      required: true

  - type: textarea
    id: safe_diagnostics
    attributes:
      label: Safe diagnostics
      description: In the GrokRouter desktop app, click Copy safe diagnostics and paste the entire report once. Include the host fingerprint and last installer phase. An unsupported app version and an unknown cloud-host hash are different failures.
      render: text
    validations:
      required: true

  - type: textarea
    id: visible_result
    attributes:
      label: What happened?
      description: Describe the last visible step, what you expected, and the exact order in which you ran GrokRouter, OpenGrok, or any other router.
      placeholder: I ran OpenGrok first, then GrokRouter. GrokRouter stopped at Step 5 after I opened the Bot computer.
    validations:
      required: true

  - type: checkboxes
    id: secret_check
    attributes:
      label: Privacy check
      options:
        - label: I confirmed this report contains no API key, device code, password, conversation, or private Bot file.
          required: true
        - label: I did not bypass the version, hash, byte-count, signature, or anchor checks and did not paste Grok host source.
          required: true
